<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>FrontDeskMaster — шаблон</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="shell">
      <main class="panel">
        <p id="status" class="status">Відкрийте бронювання в FrontDeskMaster — дані підтягнуться з відповіді API.</p>
        <p id="meta" class="meta"></p>
        <div class="actions">
          <button id="generate" type="button" disabled>Згенерувати текст</button>
          <button id="openInvoice" type="button" disabled>Інвойс (друк / PDF)</button>
        </div>
        <p id="result" class="result" hidden></p>
      </main>
      <footer class="foot">
        <a id="openOptions" class="link-subtle" href="#">Налаштування</a>
        <button type="button" id="creditsOpen" class="at-mark" aria-label="Про автора" title="Про автора">
          @
        </button>
      </footer>
    </div>

    <div id="creditsModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="creditsLine">
      <button type="button" class="modal-scrim" id="creditsScrim" aria-label="Закрити"></button>
      <div class="modal-card">
        <p id="creditsLine" class="modal-line">made by A.S.</p>
      </div>
    </div>

    <script src="templateEngine.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
